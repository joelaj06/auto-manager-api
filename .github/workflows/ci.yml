# Continuous integration: quality checks → integration tests → Docker image build, scan and publish.
# Third-party actions are pinned to full commit SHAs (version in the trailing comment);
# Dependabot keeps them up to date.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test

  integration:
    name: Integration tests (PostgreSQL, Redis, Mailpit)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: autoforce
          # Throw-away password for the CI-only service container.
          POSTGRES_PASSWORD: autoforce_ci_only
          POSTGRES_DB: autoforce_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoforce -d autoforce_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # SMTP sink for the email delivery tests (SMTP 1025, HTTP API 8025).
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      # Use the service containers above instead of starting Testcontainers.
      TEST_INFRA: external
      POSTGRES_USER: autoforce
      POSTGRES_PASSWORD: autoforce_ci_only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test:integration

  image:
    name: Docker image (build, smoke test, scan, publish)
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry (master only)
      security-events: write # upload scan results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: autoforce-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the API must start and answer inside the distroless image)
        # Throw-away values; no database is attached, so only liveness is checked.
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DATABASE_SSL=disable \
            -e PLATFORM_DB_PASSWORD=smoke_test_only_pw \
            -e TENANT_DB_PASSWORD=smoke_test_only_pw \
            -e MIGRATOR_DB_PASSWORD=smoke_test_only_pw \
            -e TENANT_JWT_SECRET=smoke_test_only_tenant_jwt_secret_0123456789 \
            -e PLATFORM_JWT_SECRET=smoke_test_only_platform_jwt_secret_0123456789 \
            -e OTP_SECRET=smoke_test_only_otp_secret_0123456789abcdef \
            autoforce-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health/live; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health/live
          docker stop --time 20 smoke
          docker logs smoke
          docker logs smoke | grep -q '"msg":"API listening"'
          docker logs smoke | grep -q '"msg":"Shutdown complete"'

      - name: Scan image (fail on fixable critical or high vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autoforce-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan image (full report for the Security tab)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autoforce-api:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload scan report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Image tags and labels
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
